[project]
name = "iknowwhatyoudid"
version = "0.1.0"
description = "A local tool to get information about how you spend your days"
readme = "README.md"
requires-python = ">=3.12"
# Zero runtime *code* dependencies, by design (research.md R1). The one exception is a
# pure-data package: Windows ships no system IANA time zone database, so `zoneinfo`
# cannot resolve "Europe/Zurich" without it. FR-007 requires the zone name to be
# recoverable, and it is the only thing that resolves a moment inside a DST repeated
# hour — so on Windows this is a correctness requirement, not a convenience.
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.scripts]
ikwyd = "iknowwhatyoudid.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iknowwhatyoudid"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]
