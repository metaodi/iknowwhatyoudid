# iknowwhatyoudid — sources
version = 1

[[source]]
name       = "work-repos"
kind       = "git.local"
since      = 2026-01-01T00:00:00+01:00
# Deliberately a path that does not exist: no test may walk the developer's
# own repositories. Tests that need real ones build them in tmp_path.
paths      = ["tests/fixtures/no-such-repositories"]
identities = ["stefan@example.com"]

[[source]]
name            = "work-mail"
kind            = "mail.outlook"
credential      = "outlook-work"
addresses       = ["stefan@example.com"]
folders.include = ["Inbox", "Sent Items"]

# A disabled source that names a credential, so `0002`'s rule stays covered: switched off
# beats missing credential, because nagging about one that will not be used is noise.
[[source]]
name       = "personal-mail"
kind       = "mail.gmail"
enabled    = false
credential = "gmail-personal"
addresses  = ["stefan@example.com"]

# `0004` changed `mail.hey`: Hey offers no IMAP, no POP and no API, and its CLI supplies
# neither recipients nor a Message-ID, so mail arrives from an export. No credential.
[[source]]
name      = "hey-archive"
kind      = "mail.hey"
enabled   = false
addresses = ["stefan@hey.com"]
paths     = ["tests/fixtures/mail/does-not-exist.mbox"]

[[source]]
name     = "recorded-day"
kind     = "fixture"
recorded = ["tests/fixtures/recorded/day.jsonl"]
