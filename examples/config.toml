# iknowwhatyoudid — sources
#
# This file says WHERE to read from. It holds no secrets: credentials are referenced
# by name, and the values live in credentials.toml beside this file.
#
# The tool never writes this file. Copy it to:
#   Windows  %APPDATA%\iknowwhatyoudid\config.toml
#   macOS    ~/Library/Application Support/iknowwhatyoudid/config.toml
#   Linux    ~/.config/iknowwhatyoudid/config.toml
#
# Then run:  ikwyd sources validate

version = 1

# --- git: local repositories -------------------------------------------------------
[[source]]
name       = "REPLACE-with-a-name-you-choose"
kind       = "git.local"
since      = 2026-01-01T00:00:00+01:00
paths      = ["REPLACE/with/a/folder/holding/repositories"]
identities = ["REPLACE@example.com"]

# --- mail ----------------------------------------------------------------------------
#
# Only mail you SENT is recorded. Mail you received is not read at all — every listing
# says so, because a quiet Tuesday must be distinguishable from one this tool does not
# look at.
#
# `credential` is a NAME; the secret never goes in this file. `client_id` is NOT a secret
# — it appears in every sign-in URL — so it lives here rather than beside the secrets.
# The one secret stored is a refresh token, which `ikwyd sources authorise` writes to
# tokens.toml, readable by you alone.
#
# Uncomment one of these once you have registered an application with the provider.

# [[source]]
# name       = "REPLACE-work-mail"
# kind       = "mail.outlook"
# credential = "REPLACE-credential-name"
# client_id  = "REPLACE-application-id"
# tenant     = "REPLACE-tenant-id"          # optional; "organizations" by default
# since      = 2026-01-01T00:00:00+01:00
# addresses  = ["REPLACE@example.com"]

# [[source]]
# name       = "REPLACE-personal-mail"
# kind       = "mail.gmail"
# credential = "REPLACE-credential-name"
# client_id  = "REPLACE-application-id"
# addresses  = ["REPLACE@example.com"]

# Hey offers no IMAP, no POP and no third-party API, and its CLI supplies neither
# recipients nor a Message-ID — so Hey mail comes from an export, as any archive does.
# No credential, no sign-in: just a path.

# [[source]]
# name      = "REPLACE-hey-mail"
# kind      = "mail.hey"                    # `mail.mbox` behaves identically
# addresses = ["REPLACE@example.com"]
# paths     = ["REPLACE/path/to/export.mbox"]

# --- calendar ------------------------------------------------------------------------
# Still a declaration: it validates, and reports `not readable` rather than pretending.

# [[source]]
# name       = "REPLACE-work-calendar"
# kind       = "calendar.google"            # or calendar.outlook
# credential = "REPLACE-credential-name"
# calendars  = ["primary"]

# Run `ikwyd sources kinds` to see every kind and the settings it accepts.
#
# Mapping people or repositories to projects does NOT go here. That is attribution, and
# it lives in projects.toml beside this file — a [projects] table here is rejected rather
# than ignored.
